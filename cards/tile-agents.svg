<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 160" width="268" height="160">
  <style>
    
    .bg { fill:#ffffff; stroke:#dde4ec; stroke-width:1 }
    .num { font-family:'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight:800; font-size:42px; fill:#0077ff }
    .label { font-family:'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight:600; font-size:14px; fill:#0f1d33; text-transform:uppercase; letter-spacing:1.5px }
    .sub { font-family:'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight:400; font-size:13px; fill:#4a5a70 }
    .arrow { fill:none; stroke:#0077ff; stroke-width:2; stroke-linecap:round }

    .pop-in { opacity:0; transform:translateY(30px) rotate(-3deg); animation:popIn 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards }
    .count-up { font-family:'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight:800; font-size:42px; fill:#0077ff }

    @keyframes popIn { to { opacity:1; transform:translateY(0) rotate(0deg) } }
    @keyframes ringPulse {
      0% { r:8; opacity:0.6 }
      100% { r:24; opacity:0 }
    }
    @keyframes nudge {
      0%,100% { transform:translateX(0) }
      50% { transform:translateX(4px) }
    }
    
    @media(prefers-reduced-motion:reduce){
      *{animation:none!important;opacity:1!important;transform:none!important}
      .fade-in,.slide-up,.grow-bar,.pop-in{opacity:1!important;transform:none!important}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="267" height="159" rx="12"/>

  <g class="pop-in" style="animation-delay:0.8s;">
    <!-- Ring pulse -->
    <circle cx="238" cy="30" fill="none" stroke="#0077ff" stroke-width="1.5"><animate attributeName="r" from="8" to="24" dur="2s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" from="0.6" to="0" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="238" cy="30" r="6" fill="#0077ff" opacity="0.15"/>

    <!-- Label -->
    <text class="label" x="24" y="36">AI AGENTS</text>

    <!-- Number with count-up -->
    <text class="num" x="24" y="90">130</text>

    <!-- Subtitle -->
    <text class="sub" x="24" y="115">commits this year</text>

    <!-- Arrow -->
    <g style="animation:nudge 2s ease infinite;animation-delay:1.8s">
      <line class="arrow" x1="24" y1="140" x2="44" y2="140"/>
      <polyline class="arrow" points="38,134 44,140 38,146"/>
    </g>
  </g>
</svg>